name: Build BountyHunt Plugin

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download PaperMC 1.26.2 JAR
        run: |
          # Get the latest build number for PaperMC 1.26.2
          BUILD_NUMBER=$(curl -s https://papermc.io/api/v2/projects/paper/versions/1.26.2 | jq -r '.builds[-1]')
          # Download the JAR
          wget "https://papermc.io/api/v2/projects/paper/versions/1.26.2/builds/$BUILD_NUMBER/downloads/paper-1.26.2.jar" -O paper-1.26.2.jar
          # Install it to Maven local repo as paper-api
          mvn install:install-file \
            -Dfile=paper-1.26.2.jar \
            -DgroupId=io.papermc.paper \
            -DartifactId=paper-api \
            -Dversion=1.26.2-R0.1-SNAPSHOT \
            -Dpackaging=jar

      - name: Build with Maven
        run: mvn clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BountyHuntPlugin
          path: target/BountyHunt-1.0.jar
